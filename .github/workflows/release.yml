name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.code-target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        code-target:
          - win32-x64
          - win32-arm64
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - alpine-x64
          - alpine-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pulls the binary out of the matching @nsis/lsp-* npm package, pinned to
      # the "nsisLspVersion" field in package.json.
      - name: Fetch language server
        run: node scripts/fetch-server.mts --target ${{ matrix.code-target }}

      - name: Package extension
        run: mkdir -p dist && pnpm exec vsce package -o "./dist/nsis-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --no-dependencies

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.code-target }}
          path: ./dist

  # A server-less build for platforms without a prebuilt binary. It falls back to
  # `nsis.serverPath` or a `nsis-lsp` found on the PATH.
  build-no-server:
    name: Package (no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package extension
        run: mkdir -p dist && pnpm exec vsce package -o "./dist/nsis-no-server.vsix" --no-dependencies

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-no-server
          path: ./dist

  publish-marketplace:
    name: Publish (VS Code Marketplace)
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - run: ls -al ./dist

      # Handing vsce every package at once means one failure aborts the whole
      # batch, and since the glob sorts win32 last, Windows is what goes
      # missing. So each package gets published on its own.
      #
      # Uploads intermittently hang. vsce's only bound is a hardcoded 180s idle
      # timer (typed-rest-client, no flag exposes it), and it arms only once a
      # socket exists - a stall during connection setup is unbounded, which is
      # how v6.1.0 wedged this step for 15h. So each attempt gets an external
      # `timeout`, which holds no matter where it hangs.
      #
      # Why an upload hangs, and why a retry sometimes clears it, is NOT
      # understood. A timed-out upload does not land server-side (checked: the
      # version's Marketplace timestamp follows the successful attempt, not the
      # timed-out ones), so the retry is blind, not a wait-for-the-server.
      # Tune with evidence, not vibes.
      - name: Publish
        timeout-minutes: 30
        run: |
          host=marketplace.visualstudio.com
          version=$(node -p 'require("./package.json").version')

          # Times one real request to the gallery, unauthenticated. Splits a
          # network-layer stall (dns/connect/tls climb) from a server-side one
          # (connect fast, ttfb climbs) - `timeout` alone cannot tell them apart.
          probe() {
            curl -sS -o /dev/null --max-time 30 \
              -X POST "https://$host/_apis/public/gallery/extensionquery" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json;api-version=3.0-preview.1' \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"idleberg.nsis"}]}],"flags":914}' \
              -w "    probe ip=%{remote_ip} http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              || echo "    probe itself failed (exit $?)"
          }

          # Which targets the Marketplace actually has for this version. Settles
          # whether a timed-out upload landed anyway, instead of inferring it.
          landed() {
            timeout 60 pnpm exec vsce show idleberg.nsis --json 2>/dev/null \
              | jq -r --arg v "$version" \
                  '[.versions[] | select(.version == $v) | .targetPlatform // "universal"] | sort | join(" ")' \
              || echo "(lookup failed)"
          }

          echo "::group::Pre-flight"
          echo "publishing version $version"
          getent ahosts "$host" || true
          probe
          echo "already on Marketplace: $(landed)"
          echo "::endgroup::"

          failed=0

          for vsix in ./dist/nsis-*.vsix; do
            for attempt in 1 2 3; do
              start=$SECONDS
              status=0

              # Last attempt gets a socket-level trace, so a hang leaves evidence
              # of where it stopped. Too noisy to run on every attempt.
              if [ $attempt -eq 3 ]; then
                NODE_DEBUG=net,http,tls timeout --foreground 300 \
                  pnpm exec vsce publish --packagePath "$vsix" --skip-duplicate \
                  >/tmp/trace.log 2>&1 || status=$?
              else
                timeout --foreground 300 \
                  pnpm exec vsce publish --packagePath "$vsix" --skip-duplicate || status=$?
              fi

              if [ $status -eq 0 ]; then
                continue 2
              fi

              # 124 = killed by `timeout`, i.e. the hang, not a rejection.
              echo "::warning::$vsix attempt $attempt exited $status after $((SECONDS - start))s"

              echo "::group::Diagnostics for $vsix attempt $attempt"
              probe
              echo "    on Marketplace now: $(landed)"
              if [ -f /tmp/trace.log ]; then
                echo "    --- last 100 lines of socket trace ---"
                tail -100 /tmp/trace.log
                rm -f /tmp/trace.log
              fi
              echo "::endgroup::"

              sleep 30
            done

            echo "::error::$vsix could not be published"
            failed=1
          done

          exit $failed
        env:
          VSCE_PAT: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}

  publish-openvsx:
    name: Publish (Open VSX)
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish
        run: pnpm exec ovsx publish --packagePath ./dist/nsis-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PERSONAL_ACCESS_TOKEN }}

  release:
    name: GitHub Release
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.vsix

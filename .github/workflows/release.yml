name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.code-target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        code-target:
          - win32-x64
          - win32-arm64
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - alpine-x64
          - alpine-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pulls the binary out of the matching @nsis/lsp-* npm package, pinned to
      # the "nsisLspVersion" field in package.json.
      - name: Fetch language server
        run: node scripts/fetch-server.mts --target ${{ matrix.code-target }}

      - name: Package extension
        run: mkdir -p dist && pnpm exec vsce package -o "./dist/nsis-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --no-dependencies

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.code-target }}
          path: ./dist

  # A server-less build for platforms without a prebuilt binary. It falls back to
  # `nsis.serverPath` or a `nsis-lsp` found on the PATH.
  build-no-server:
    name: Package (no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package extension
        run: mkdir -p dist && pnpm exec vsce package -o "./dist/nsis-no-server.vsix" --no-dependencies

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-no-server
          path: ./dist

  publish-marketplace:
    name: Publish (VS Code Marketplace)
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - run: ls -al ./dist

      # The Marketplace times out often enough that a single attempt is a coin
      # flip. `--skip-duplicate` makes a retry skip whatever already landed.
      - name: Publish
        run: |
          for attempt in 1 2 3; do
            if pnpm exec vsce publish --packagePath ./dist/nsis-*.vsix --skip-duplicate; then
              exit 0
            fi

            echo "::warning::Attempt $attempt failed, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done

          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}

  publish-openvsx:
    name: Publish (Open VSX)
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish
        run: pnpm exec ovsx publish --packagePath ./dist/nsis-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PERSONAL_ACCESS_TOKEN }}

  release:
    name: GitHub Release
    needs: [build, build-no-server]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.vsix
